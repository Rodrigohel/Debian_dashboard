# Copie para /etc/apache2/conf-available/ip-dashboard.conf e rode:
#   sudo a2enmod proxy proxy_http proxy_wstunnel
#   sudo a2enconf ip-dashboard
#   sudo systemctl reload apache2

Alias /ip-dashboard /opt/ip-dashboard/frontend/dist

<Directory /opt/ip-dashboard/frontend/dist>
    Options -Indexes
    AllowOverride None
    Require all granted
    FallbackResource /ip-dashboard/index.html
</Directory>

ProxyPass /ip-dashboard/api/ http://127.0.0.1:3002/api/
ProxyPassReverse /ip-dashboard/api/ http://127.0.0.1:3002/api/

ProxyPass /ip-dashboard/ws ws://127.0.0.1:3002/ws
ProxyPassReverse /ip-dashboard/ws ws://127.0.0.1:3002/ws
