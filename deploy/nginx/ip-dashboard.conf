# Inclua estas regras dentro do bloco `server { ... }` do seu site já
# existente (ou crie um site novo dedicado, ajustando server_name/listen).
# Serve o frontend estático (build de `frontend/dist`) em /ip-dashboard/ e
# encaminha a API + WebSocket para o backend Node local.

location /ip-dashboard/ {
    alias /opt/ip-dashboard/frontend/dist/;
    try_files $uri $uri/ /ip-dashboard/index.html;
}

location /ip-dashboard/api/ {
    proxy_pass http://127.0.0.1:3002/api/;
    proxy_set_header Host $host;
}

location /ip-dashboard/ws {
    proxy_pass http://127.0.0.1:3002/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $upgrade;
    proxy_set_header Connection "upgrade";
}
